<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — Книжный Вайб</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;700&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Хедер -->
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <a class="logo" href="index.html">Книжный Вайб</a>

        <nav aria-label="Основное меню">
          <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="genres.html">Жанры</a></li>
            <li><a href="authors.html">Авторы</a></li>
            <li><a href="reviews.html">Рецензии</a></li>
            <li><a href="collections.html">Подборки</a></li>
            <li><a href="recommendations.html">Рекомендации</a></li>
          </ul>
        </nav>
      </div>

      <div class="bar2">
        <form class="search" role="search" action="catalog.html" method="get" data-js="search-form">
          <svg class="ico-s mag" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <input type="search" name="q" placeholder="Название, автор, жанр" aria-label="Поиск по магазину" data-js="search" autocomplete="off">
          <span class="key" aria-hidden="true">/</span>
          <div data-js="search-suggest" hidden></div>
        </form>

        <a class="act" href="shelf.html">
          <svg class="ico-s" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="4" height="16" rx="1"/>
            <rect x="10" y="4" width="4" height="16" rx="1"/>
            <path d="m16 6 4 13"/>
          </svg>
          <span class="lbl">Моя полка</span>
          <span class="badge" data-js="shelf-count">0</span>
        </a>

        <a class="act main" href="cart.html" aria-current="page">
          <svg class="ico-s" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 8h14l-1 12H6L5 8Z"/>
            <path d="M9 8a3 3 0 0 1 6 0"/>
          </svg>
          <span class="lbl">Корзина</span>
          <span class="badge" data-js="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main>
    <div class="wrap">
      
      <div class="head">
        <h1>Корзина</h1>
      </div>

      <div class="two">
        <!-- Список товаров -->
        <table class="table" data-js="cart-list">
          <thead>
            <tr>
              <th>Книга</th>
              <th>Цена</th>
              <th>Кол-во</th>
            </tr>
          </thead>
          <tbody>
            <tr data-book-id="1" data-price="590">
              <td>Мастер и Маргарита</td>
              <td>590 ₽</td>
              <td>
                <input class="field" type="number" min="1" value="1" aria-label="Количество">
              </td>
            </tr>
            <tr data-book-id="5" data-price="640">
              <td>Хоббит</td>
              <td>640 ₽</td>
              <td>
                <input class="field" type="number" min="1" value="1" aria-label="Количество">
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Панель оформления заказа -->
        <form class="panel form">
          <h3>Ваш заказ</h3>
          <p>Итого: <b data-js="cart-total">1 230 ₽</b></p>
          <input class="field" type="text" name="promo" placeholder="Промокод">
          <button class="btn" type="submit">Оформить заказ</button>
        </form>
      </div>

    </div>
  </main>

  <!-- Футер -->
  <footer>
    <div class="wrap">
      <span>Книжный Вайб — читаем медленно, выбираем быстро</span>
      <span>
        <a href="catalog.html">Каталог</a> · 
        <a href="collections.html">Подборки</a> · 
        <a href="cart.html">Корзина</a>
      </span>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
